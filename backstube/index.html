<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smittenbrot Backstube</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ── Login gate ─────────────────────────────────────────────── -->
<div id="login" hidden>
  <div class="box">
    <img src="assets/logo.svg" alt="Smittenbrot">
    <h1>Backstube</h1>
    <p class="hint">Internal production planning</p>

    <form id="login-email">
      <label class="field">
        <span>Email</span>
        <input type="email" id="li-email" autocomplete="username" required>
      </label>
      <button class="btn primary" type="submit">Send 6-digit code</button>
    </form>

    <form id="login-code" hidden>
      <label class="field">
        <span>6-digit code</span>
        <input type="text" id="li-code" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]*" required>
      </label>
      <button class="btn primary" type="submit">Sign in</button>
      <button class="btn ghost" type="button" id="li-back"
              style="width:100%;margin-top:8px">Use a different email</button>
    </form>

    <div class="msg hint" id="li-msg"></div>
  </div>
</div>

<!-- ── App ────────────────────────────────────────────────────── -->
<div id="app" hidden>
  <aside id="sidebar">
    <div class="brand">
      <img src="assets/logo.svg" alt="">
      <span>SMITTENBROT<br><em>Backstube</em></span>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <span id="who"></span><br>
      <button id="signout">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/lib.js"></script>
<script src="js/engine.js"></script>
<script src="js/screens/ingredients.js"></script>
<script src="js/screens/starters.js"></script>
<script src="js/screens/recipes.js"></script>
<script src="js/screens/bakeday.js"></script>
<script src="js/app.js"></script>
</body>
</html>
